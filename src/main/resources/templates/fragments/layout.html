<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduManage | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<aside th:fragment="sidebar" class="bg-dark text-white d-flex flex-column" id="sidebar-wrapper" style="min-width: 240px;">
    <div class="brand p-3 border-bottom border-secondary fw-bold">
        <i class="bi bi-mortarboard-fill me-2"></i> EduManage
    </div>
    <nav class="list-group list-group-flush flex-grow-1">
        <a th:href="@{/dashboard}" class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
        <a th:href="@{/students}" class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-people me-2"></i> Students
        </a>
        <a th:href="@{/add-student}" class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-person-plus me-2"></i> Add Student
        </a>
        <a th:href="@{/courses}" class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-book me-2"></i> Courses
        </a>
        <a th:href="@{/add-course}" class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-journal-plus me-2"></i> Add Course
        </a>
        <a th:href="@{/enroll-course}" class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-check2-square me-2"></i> Enroll Course
        </a>
        <a th:href="@{/enrolled-students}" class="list-group-item list-group-item-action bg-dark text-white border-0">
            <i class="bi bi-card-checklist me-2"></i> Enrolled Students
        </a>
    </nav>
    <div class="p-2 border-top border-secondary">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light btn-sm w-100 text-start">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
            </button>
        </form>
    </div>
</aside>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container-fluid">
        <button class="btn btn-outline-light" id="sidebarToggle" type="button">
            <i class="bi bi-list"></i>
        </button>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" id="navbarDropdown" role="button"
                       data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i> Admin User
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                        <li><a class="dropdown-item" th:href="@{/dashboard}">Dashboard</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3 py-1">
                                <button type="submit" class="btn btn-link text-danger p-0 text-decoration-none">
                                    Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="py-4 bg-dark text-light mt-auto border-top border-secondary">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center justify-content-between small">
            <div class="text-secondary">Copyright &copy; EduManage 2026</div>
            <div>
                <a href="#" class="text-decoration-none text-secondary">Privacy Policy</a>
                &middot;
                <a href="#" class="text-decoration-none text-secondary">Terms &amp; Conditions</a>
            </div>
        </div>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const sidebarToggle = document.body.querySelector('#sidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', event => {
                    event.preventDefault();
                    document.body.classList.toggle('sb-sidenav-toggled');
                });
            }
        });
    </script>
</th:block>
</body>
</html>
